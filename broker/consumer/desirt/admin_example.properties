bootstrap.servers=vm051.bridges2.psc.edu:9093
# The public listener is SASL_SSL with SCRAM-SHA-512. TLS proves the broker is
# us and encrypts the exchange; SCRAM keeps the password itself off the wire.
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule \
    required username="USERNAME" password="PASSWORD";
# The broker's certificate is signed by a PRIVATE CA, so your JVM's default
# trust store will never accept it: point at the farts-ca.crt you were handed.
# truststore.type=PEM (Kafka >= 2.7) reads the PEM directly -- no keytool, no
# JKS, no store password. A PEM trust store takes no password by design.
ssl.truststore.type=PEM
ssl.truststore.location=/path/to/farts-ca.crt
# Older client jars (< 2.7) cannot read PEM. For those, convert once:
#     keytool -import -alias farts-ca -file farts-ca.crt -noprompt \
#             -keystore farts.truststore.jks -storepass <your choice>
# and use these three lines INSTEAD of the two above:
#ssl.truststore.type=JKS
#ssl.truststore.location=/path/to/farts.truststore.jks
#ssl.truststore.password=<your choice>
# Your ACL scopes group ids to your own username prefix, so this MUST start
# with "USERNAME-". Anything else fails with GroupAuthorizationException within
# a second of connecting, AFTER TLS and SASL both succeeded -- which reads like
# a server problem and is not one.
group.id=USERNAME-cli
# Where a group with no committed offsets starts. Note that the console
# consumer commits offsets for a named group.id, so the SECOND run of the
# command above resumes where the first stopped and --from-beginning has no
# effect. To re-read a night, use a fresh group id (USERNAME-cli2, ...).
auto.offset.reset=earliest
# ~49 KB packets (~25-54 KB): 50 MB per fetch is ~1070 alerts in flight.
fetch.max.bytes=52428800
# Subscribe by PATTERN (--include '^farts_v2_[0-9]{8}$'), never by a fixed
# --topic. There is one topic per observing night, farts_v2_<YYYYMMDD>, created
# when that night is published; a pattern picks up a new night on the next
# metadata refresh with nothing to reconfigure. Live nights are retained 7
# days, backfilled historical nights indefinitely.
#
# Schema 0.2.0 (2026-09-27) moved the stream from farts_<YYYYMMDD> to
# farts_v2_<YYYYMMDD>. '^farts_[0-9]{8}$' does NOT match the new names -- and
# the 0.1.0 topics it matched were retired on 2026-09-29. Your credential's ACL is on the prefix farts_, because
# the ACL is on the 'farts_' family prefix.
#
# --from-beginning with that pattern positions a NEW group at offset 0 of EVERY
# night on the broker (15 farts_v2_* nights, ~137 GB as of 2026-09-29), and the
# first message may come from the newest night. --max-messages 1 keeps the smoke
# test above cheap; for a first real look name one night:
# --include '^farts_v2_20260918$'.
