        function create_lite_alert(message, metadata) {
          const data = JSON.parse(message.data);
          const alertLite = data["alert_lite"];

          // Whitelist fields for diaSource
          const diaSourceFields = [
            "diaSourceId", "midpointMjdTai", "ra", "raErr", "dec", "decErr",
            "psfFlux", "psfFluxErr", "band"
          ];

          // Whitelist fields for diaObject
          const diaObjectFields = [
            "diaObjectId", "lastDiaSourceMjdTai", "firstDiaSourceMjdTai",
            "nDiaSources", "u_psfFluxErrMean", "g_psfFluxErrMean", "r_psfFluxErrMean",
            "i_psfFluxErrMean", "z_psfFluxErrMean", "y_psfFluxErrMean"
          ];

          // Filter fields
          function filterFields(obj, fields) {
            if (!obj) return obj;
            const filtered = {};
            for (const f of fields) {
              if (obj.hasOwnProperty(f)) {
                filtered[f] = obj[f];
              }
            }
            return filtered;
          }

          // Filter lists of objects
          function filterList(list, fields) {
            if (!Array.isArray(list)) return list;
            return list.map(item => filterFields(item, fields));
          }

          // Replace alertLite fields with filtered versions
          alertLite["diaSource"] = filterFields(alertLite["diaSource"], diaSourceFields);
          alertLite["prvDiaSources"] = filterList(alertLite["prvDiaSources"], diaSourceFields);
          alertLite["diaObject"] = filterFields(alertLite["diaObject"], diaObjectFields);

          // Remove cutouts
          delete alertLite["cutoutDifference"];
          delete alertLite["cutoutScience"];
          delete alertLite["cutoutTemplate"];

          // Keep diaSourceId, observation_reason, target_name, prv_forced_sources, ssSource, and MPCORB unchanged
          data["alert_lite"] = alertLite;
          message.data = JSON.stringify(data);
          return message;
        }
    functionName: create_lite_alert
